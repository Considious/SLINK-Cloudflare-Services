name: Publish Cracking dictionary source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-cracking-dictionary.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cracking-dictionary-source-v1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish immutable dictionary shards
        shell: bash
        run: |
          set -euo pipefail
          branch=cracking-dictionary-v1
          existing="$(git ls-remote --heads origin "refs/heads/$branch")"
          if [[ -n "$existing" ]]; then
            echo 'Dictionary v1 is already published.'
            exit 0
          fi
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/Considious/Torn-Scripts/f21cb04be5f3558443957169c455cb39adb26009/Torn_Cracking_Combined_Passwords.txt' --output "$RUNNER_TEMP/torn-cracking.txt"
          node workers/contribution/prepare-cracking-dictionary.mjs "$RUNNER_TEMP/torn-cracking.txt" "$RUNNER_TEMP/shards"
          git switch --orphan "$branch"
          cp -R "$RUNNER_TEMP/shards/crime-dictionaries" .
          git add crime-dictionaries/
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish Torn Cracking dictionary v1'
          git push origin "HEAD:refs/heads/$branch"
